<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Canteen - Login</title>
    <!-- <base href="/smart-canteen/"> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topbar">
        <img src="logo.svg" alt="Smart Canteen logo" class="logo">
    </div>
    <main class="page">
        <header class="hero">
            <p class="badge">Poornima University - Smart Canteen</p>
            <h1>Student Login</h1>
            <p>Use your college credentials to access pre-order services.</p>
        </header>

        <section class="panel login-panel">
            <div class="panel-head">
                <h2>Sign in</h2>
                <p>Login to place orders and view your pickup tokens.</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="row">
                    <div class="field">
                        <label for="loginId">Enrollment / Email</label>
                        <input id="loginId" type="text" required placeholder="PU24BCA101 or name@poornima.edu">
                    </div>
                    <div class="field">
                        <label for="loginPassword">Password</label>
                        <input id="loginPassword" type="password" required placeholder="Enter password">
                    </div>
                </div>

                <div class="row">
                    <div class="field small">
                        <label for="role">Role</label>
                        <select id="role" required>
                            <option value="">Select role</option>
                            <option value="Student" selected>Student</option>
                            <option value="Faculty">Faculty</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="rememberMe">Remember me</label>
                        <div class="checkbox-wrap">
                            <input id="rememberMe" type="checkbox">
                            <span>Keep me signed in on this device</span>
                        </div>
                    </div>
                </div>

                <div class="row action-row">
                    <button type="submit" class="primary-btn">Login</button>
                    <a class="secondary-btn btn-link" href="signup.html">Create New Account</a>
                </div>
                <p class="login-help">Forgot password? Visit the canteen desk or contact IT.</p>
            </form>
            <div class="row action-row">
                <a class="secondary-btn btn-link" href="/smart-canteen/">Go to Main Page</a>
            </div>
        </section>
    </main>
    <script>
        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();
            window.location.href = "smartcanteen.html";
        });
    </script>
</body>
</html>
